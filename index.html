<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="С днём рождения, Катюша" />
    <meta name="theme-color" content="#fff0f5" />
    <title>Катюша · 24</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <canvas id="particles" aria-hidden="true"></canvas>

    <div class="shell">
      <!-- Intro: письмо от голубя -->
      <section class="screen screen--intro is-active" id="intro" aria-label="Заставка">
        <div class="intro-sky"></div>

        <div class="intro-dove" id="intro-dove"></div>

        <div class="intro-copy" id="intro-copy">
          <p class="intro-eyebrow" data-bind="intro.eyebrow"></p>
          <h1 class="intro-title" data-bind="intro.title"></h1>
          <p class="intro-subtitle" data-bind="intro.subtitle"></p>
          <button class="cta intro-cta" type="button" id="intro-start">Открыть</button>
        </div>
      </section>

      <!-- Stories -->
      <section class="screen screen--stories" id="stories" aria-label="Истории" hidden>
        <div class="progress" id="progress" role="tablist" aria-label="Прогресс"></div>

        <div class="story-viewport">
          <div class="story-slide" id="story-slide">
            <div class="story-bg" id="story-bg"></div>
            <div class="story-content" id="story-content"></div>
          </div>

          <div class="dove-companion" id="dove-companion" aria-hidden="true"></div>

          <div class="heart-burst" id="heart-burst" aria-hidden="true">
            <svg class="heart-burst__svg" viewBox="0 0 120 110" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="heart-fill" x1="20%" y1="10%" x2="80%" y2="100%">
                  <stop offset="0%" stop-color="#fff6f8"/>
                  <stop offset="42%" stop-color="#f5a8bc"/>
                  <stop offset="100%" stop-color="#d4789a"/>
                </linearGradient>
                <filter id="heart-glow" x="-40%" y="-40%" width="180%" height="180%">
                  <feGaussianBlur stdDeviation="3.5" result="blur"/>
                  <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
              </defs>
              <path
                filter="url(#heart-glow)"
                fill="url(#heart-fill)"
                stroke="#e8c872"
                stroke-width="1.6"
                d="M60 96 C60 96 14 64 14 38 C14 22 26 12 40 12 C50 12 56 18 60 26 C64 18 70 12 80 12 C94 12 106 22 106 38 C106 64 60 96 60 96 Z"
              />
              <path
                fill="#fffbf7"
                opacity="0.45"
                d="M42 28 C36 28 30 33 30 40 C30 36 36 30 44 30 C48 30 52 32 54 36 C52 32 48 28 42 28 Z"
              />
            </svg>
            <span class="heart-burst__spark heart-burst__spark--a"></span>
            <span class="heart-burst__spark heart-burst__spark--b"></span>
            <span class="heart-burst__spark heart-burst__spark--c"></span>
          </div>

          <div class="tap-zones">
            <button type="button" class="tap-zone tap-zone--prev" id="tap-prev" aria-label="Назад"></button>
            <button type="button" class="tap-zone tap-zone--next" id="tap-next" aria-label="Дальше"></button>
          </div>
        </div>

        <p class="story-hint">Тап — дальше · Удерживай — пауза</p>
      </section>

      <!-- Finale -->
      <section class="screen screen--finale" id="finale" aria-label="Финал" hidden>
        <div class="finale-glow" aria-hidden="true"></div>

        <div class="finale-dove" id="finale-dove"></div>

        <div class="finale-lines" id="finale-lines"></div>

        <button class="cta finale-replay" type="button" id="finale-replay">Посмотреть ещё раз</button>
      </section>
    </div>

    <script src="js/config.js"></script>
    <script src="js/dove.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
