<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" fill="none" aria-hidden="true">
  <!-- tail -->
  <path d="M28 58 C18 52 8 56 4 62 C12 60 20 62 28 66 Z" fill="#E8E0D8"/>
  <path d="M34 60 C24 54 14 58 10 66 C18 62 26 64 34 68 Z" fill="#DDD4CC"/>
  <!-- wing back -->
  <path d="M52 48 C38 38 18 42 10 52 C22 46 38 44 54 50 Z" fill="#EDE6DE"/>
  <!-- body -->
  <ellipse cx="72" cy="56" rx="26" ry="18" fill="#FFFBF7"/>
  <ellipse cx="78" cy="52" rx="14" ry="11" fill="#F7F0E8"/>
  <!-- wing front -->
  <path d="M62 50 C78 36 108 38 118 50 C100 48 82 50 66 56 Z" fill="#F5EDE4"/>
  <path d="M66 52 C82 40 104 42 112 52 C96 50 80 52 68 58 Z" fill="#EDE4DA"/>
  <!-- head -->
  <circle cx="98" cy="44" r="13" fill="#FFFBF7"/>
  <!-- cheek blush -->
  <ellipse cx="104" cy="48" rx="5" ry="3" fill="#F5C6D0" opacity="0.55"/>
  <!-- eye -->
  <circle cx="102" cy="42" r="2.2" fill="#4A3540"/>
  <circle cx="102.8" cy="41.2" r="0.7" fill="#FFFBF7"/>
  <!-- beak -->
  <path d="M108 44 L116 42 L108 47 Z" fill="#E8B88A"/>
  <!-- letter in beak -->
  <g class="dove-letter">
    <rect x="114" y="36" width="22" height="16" rx="2" fill="#FFFBF7" stroke="#E8C872" stroke-width="1.2"/>
    <path d="M114 38 L125 44 L136 38" stroke="#F5C6D0" stroke-width="1" fill="none"/>
    <circle cx="125" cy="44" r="3" fill="#E8C872"/>
    <path d="M125 42.5 L125.6 43.8 L124.2 43.8 Z" fill="#FFFBF7"/>
  </g>
  <!-- feet -->
  <path d="M64 70 L62 76 M68 71 L66 77 M72 70 L70 76" stroke="#E8A4B8" stroke-width="1.4" stroke-linecap="round"/>
  <!-- olive sprig hint -->
  <path d="M116 46 C120 44 124 46 126 50" stroke="#C8D8B8" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
</svg>
